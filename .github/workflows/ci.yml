name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run i18n:check
      - run: npm audit --audit-level=high
      - run: npm run db:test
      - run: npm run db:types
      - run: git diff --exit-code src/lib/supabase/types.ts
      - run: npm run format:check
      - run: npm run build
